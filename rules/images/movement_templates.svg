<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Straight Template (Left) -->
  <g transform="translate(60, 50) scale(2.2)">
    <g id="template_straight">
<rect x="0.0" y="0.0" width="65.0" height="200.0" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" rx="3" />
<line x1="32.5" y1="200.0" x2="32.5" y2="0.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4" />
<line x1="0.0" y1="200.0" x2="65.0" y2="200.0" stroke="#0f172a" stroke-width="4.0" stroke-linecap="square" />
<g transform="translate(32.5, 212.0)"><text x="0" y="0" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#0f172a" text-anchor="middle">START</text></g>
<line x1="0.0" y1="160.0" x2="65.0" y2="160.0" stroke="#2563eb" stroke-width="2.8" stroke-linecap="square" />
<g transform="translate(32.5, 180.0)"><text x="0" y="0" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L1 R1</text></g>
<line x1="0.0" y1="120.0" x2="65.0" y2="120.0" stroke="#2563eb" stroke-width="2.8" stroke-linecap="square" />
<g transform="translate(32.5, 140.0)"><text x="0" y="0" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L2 R2</text></g>
<line x1="0.0" y1="80.0" x2="65.0" y2="80.0" stroke="#2563eb" stroke-width="2.8" stroke-linecap="square" />
<g transform="translate(32.5, 100.0)"><text x="0" y="0" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L3 R3</text></g>
<line x1="0.0" y1="40.0" x2="65.0" y2="40.0" stroke="#2563eb" stroke-width="2.8" stroke-linecap="square" />
<g transform="translate(32.5, 60.0)"><text x="0" y="0" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L4 R4</text></g>
<line x1="0.0" y1="0.0" x2="65.0" y2="0.0" stroke="#2563eb" stroke-width="2.8" stroke-linecap="square" />
<g transform="translate(32.5, 20.0)"><text x="0" y="0" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L5 R5</text></g>
</g>
  </g>

  <!-- Curve Template (Top Right) -->
  <g transform="translate(340, 50) scale(2.2)">
    <g id="template_curve_medium">
<path d="M 0.0 130.0 A 130.0 130.0 0 0 1 139.1 0.3 L 134.5 65.2 A 65.0 65.0 0 0 0 65.0 130.0 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
<path d="M 32.5 130.0 A 97.5 97.5 0 0 1 136.8 32.7" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4" />
<line x1="0.0" y1="130.0" x2="65.0" y2="130.0" stroke="#0f172a" stroke-width="4.0" stroke-linecap="square" />
<g transform="translate(32.5, 142.0)"><text x="0" y="0" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#0f172a" text-anchor="middle">START</text></g>
<line x1="76.8" y1="92.7" x2="23.5" y2="55.4" stroke="#2563eb" stroke-width="2.8" stroke-linecap="square" />
<g transform="translate(37.0, 100.7) rotate(-72.5)"><text x="0" y="0" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L2 R1</text></g>
<line x1="107.8" y1="68.9" x2="85.5" y2="7.8" stroke="#2563eb" stroke-width="2.8" stroke-linecap="square" />
<g transform="translate(70.6, 52.6) rotate(-37.5)"><text x="0" y="0" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L4 R2</text></g>
<line x1="134.5" y1="65.2" x2="139.1" y2="0.3" stroke="#2563eb" stroke-width="2.8" stroke-linecap="square" />
<g transform="translate(116.4, 33.4) rotate(-8.0)"><text x="0" y="0" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L5 R3</text></g>
</g>
  </g>

  <!-- Spin Disc Template (Bottom Center) -->
  <g transform="translate(350, 590) scale(2.2)">
    <g id="template_spin">
<circle cx="95.0" cy="65.0" r="35.0" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
<circle cx="95.0" cy="65.0" r="3" fill="#0f172a" />
<line x1="95.0" y1="65.0" x2="95.0" y2="30.0" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
<g transform="translate(95.0, 24.0)"><text x="0" y="0" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#0f172a" text-anchor="middle">START</text></g>
<line x1="95.0" y1="65.0" x2="130.0" y2="65.0" stroke="#2563eb" stroke-width="2.4" />
<g transform="translate(136.0, 68.0)"><text x="0" y="0" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#1d4ed8" text-anchor="start" dominant-baseline="central">L1 R-1 (90°)</text></g>
<line x1="95.0" y1="65.0" x2="95.0" y2="100.0" stroke="#2563eb" stroke-width="2.4" />
<g transform="translate(95.0, 112.0)"><text x="0" y="0" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L2 R-2 (180°)</text></g>
<line x1="95.0" y1="65.0" x2="60.0" y2="65.0" stroke="#2563eb" stroke-width="2.4" />
<g transform="translate(54.0, 68.0)"><text x="0" y="0" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#1d4ed8" text-anchor="end" dominant-baseline="central">L3 R-3 (270°)</text></g>
<g transform="translate(95.0, 15.0)"><text x="0" y="0" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L4 R-4 (360°)</text></g>
<path d="M 114.2 65.0 A 19.2 19.2 0 0 1 95.0 84.2" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />
</g>
  </g>

  <!-- Pivot Fan Template (Bottom Right) -->
  <g transform="translate(560, 560) scale(2.2)">
    <g id="template_pivot">
<path d="M 90.0 80.0 L 25.0 80.0 A 65.0 65.0 0 0 1 155.0 80.0 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
<circle cx="90.0" cy="80.0" r="3.5" fill="#ef4444" />
<g transform="translate(90.0, 93.0)"><text x="0" y="0" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ef4444" text-anchor="middle" dominant-baseline="central">PIN</text></g>
<line x1="25.0" y1="80.0" x2="90.0" y2="80.0" stroke="#0f172a" stroke-width="4.0" stroke-linecap="square" />
<g transform="translate(57.5, 92.0)"><text x="0" y="0" font-family="sans-serif" font-size="7" font-weight="bold" fill="#0f172a" text-anchor="middle">START</text></g>
<line x1="90.0" y1="80.0" x2="44.0" y2="34.0" stroke="#2563eb" stroke-width="2.6" />
<g transform="translate(58.7, 45.7)"><text x="0" y="0" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L1 R0 (45°)</text></g>
<line x1="90.0" y1="80.0" x2="90.0" y2="15.0" stroke="#2563eb" stroke-width="2.6" />
<g transform="translate(90.0, 32.8)"><text x="0" y="0" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L2 R0 (90°)</text></g>
<line x1="90.0" y1="80.0" x2="136.0" y2="34.0" stroke="#2563eb" stroke-width="2.6" />
<g transform="translate(121.3, 45.7)"><text x="0" y="0" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L3 R0 (135°)</text></g>
<line x1="90.0" y1="80.0" x2="155.0" y2="80.0" stroke="#2563eb" stroke-width="2.6" />
<g transform="translate(122.5, 92.0)"><text x="0" y="0" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L4 R0 (180°)</text></g>
</g>
  </g>

  <!-- Explanatory Rulebook Callouts -->
  <g font-family="sans-serif" fill="#1e293b">
    <!-- Straight notes -->
    <text x="60" y="820" font-size="16" font-weight="bold">Straight (1 to 5)</text>
    <text x="60" y="842" font-size="13" fill="#64748b">Place at rear for reverse (-1 to -5)</text>

    <!-- Curve notes -->
    <text x="560" y="440" font-size="16" font-weight="bold">Curve Template</text>
    <text x="560" y="462" font-size="13" fill="#64748b">Align bumper to marked stop line</text>
    <text x="560" y="482" font-size="13" fill="#64748b">Flip for Left | Back for Reverse</text>

    <!-- Spin notes -->
    <text x="350" y="842" font-size="14" font-weight="bold" text-anchor="middle">Spin on Spot</text>
    <text x="350" y="862" font-size="12" fill="#64748b" text-anchor="middle">Rotate around center (90° / unit)</text>

    <!-- Pivot notes -->
    <text x="730" y="842" font-size="14" font-weight="bold" text-anchor="middle">Pivot Fan</text>
    <text x="730" y="862" font-size="12" fill="#64748b" text-anchor="middle">Pivot on locked wheel (45° / unit)</text>
  </g>
</svg>