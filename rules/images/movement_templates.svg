<line x1="35.0" y1="35.0" x2="35.0" y2="0.0" stroke="#0f172a" stroke-width="3.5" stroke-linecap="square" />
<line x1="35.0" y1="35.0" x2="70.0" y2="35.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="square" />
<line x1="35.0" y1="35.0" x2="35.0" y2="70.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="square" />
<line x1="35.0" y1="35.0" x2="0.0" y2="35.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="square" />
<line x1="61.0" y1="20.0" x2="65.3" y2="17.5" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" />
<g transform="translate(57.9, 21.7)"><text x="0" y="0" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#b45309" text-anchor="middle" dominant-baseline="central">1</text></g>
<line x1="61.0" y1="50.0" x2="65.3" y2="52.5" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" />
