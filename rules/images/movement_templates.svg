<line x1="65.0" y1="65.0" x2="65.0" y2="0.0" stroke="#2563eb" stroke-width="2.6" stroke-linecap="square" />
<g transform="translate(57.3, 25.4) rotate(-90.0)"><text x="0" y="0" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L2 R0</text></g>
<line x1="65.0" y1="65.0" x2="111.0" y2="19.0" stroke="#2563eb" stroke-width="2.6" stroke-linecap="square" />
