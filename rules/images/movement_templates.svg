<g transform="translate(15.8, 42.0)"><text x="0" y="0" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L3 R-3</text></g>
<g transform="translate(28.0, 15.8) rotate(-90)"><text x="0" y="0" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L4 R-4</text></g>
</g>
