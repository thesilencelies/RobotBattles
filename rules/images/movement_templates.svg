<line x1="35.0" y1="5.0" x2="35.0" y2="0.0" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" />
<g transform="translate(41.5, 8.5)"><text x="0" y="0" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#b45309" text-anchor="middle" dominant-baseline="central">6</text></g>
<g transform="translate(54.2, 28.0)"><text x="0" y="0" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">L1 R-1</text></g>
