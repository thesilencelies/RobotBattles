<line x1="9.0" y1="50.0" x2="4.7" y2="52.5" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" />
<g transform="translate(12.1, 48.3)"><text x="0" y="0" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#b45309" text-anchor="middle" dominant-baseline="central">4</text></g>
<line x1="9.0" y1="20.0" x2="4.7" y2="17.5" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" />
