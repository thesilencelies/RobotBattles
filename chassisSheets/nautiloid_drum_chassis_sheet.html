<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nautiloid Drum Chassis - A3 Chassis Mat</title>
  <style>
    @page {
      size: A3 landscape;
      margin: 0;
    }
    body {
      margin: 0;
      padding: 0;
      background: #0f141c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .sheet-wrapper {
      width: 420mm;
      height: 297mm;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    @media print {
      body {
        background: none;
      }
      .sheet-wrapper {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="sheet-wrapper">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420.0 297.0" width="420.0mm" height="297.0mm" class="a3-sheet-svg">
  <defs>
    <pattern id="grid-10" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#2a3342" stroke-width="0.3" opacity="0.6"/>
    </pattern>
    <pattern id="grid-50" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#grid-10)"/>
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#3b485d" stroke-width="0.7" opacity="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00d26a"/>
    </marker>
  </defs>

  <!-- Sheet Background -->
  <rect x="0" y="0" width="420.0" height="297.0" fill="#0f141c" stroke="#1f2937" stroke-width="1"/>

  <!-- Grid Layer -->
  <rect x="0" y="0" width="420.0" height="297.0" fill="url(#grid-50)"/>

  <!-- Centerlines -->
  <line x1="210.0" y1="35" x2="210.0" y2="272.0" stroke="#00e5ff" stroke-width="0.4" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="30" y1="148.5" x2="390.0" y2="148.5" stroke="#00e5ff" stroke-width="0.4" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Chassis Boundary Shape -->
  <polygon points="12.0,65.0 408.0,65.0 408.0,235.0 12.0,235.0" fill="rgba(0, 229, 255, 0.04)" stroke="#00e5ff" stroke-width="2.5" stroke-linejoin="round" class="chassis-boundary-shape"/>

  <!-- Forward / Facing Indicator -->
  <g class="facing-indicator" transform="translate(210.0, 20)">
    <line x1="0" y1="8" x2="0" y2="0" stroke="#00d26a" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="0" y="-2" fill="#00d26a" font-family="sans-serif" font-size="5" font-weight="bold" text-anchor="middle" letter-spacing="1">FRONT / HEADING</text>
  </g>

  <!-- Chassis Corner Information Plate with Picture & Printed Stats on Mat -->
  <g class="chassis-corner-plate" transform="translate(12, 6)">
    <rect x="0" y="0" width="82" height="52" rx="4" fill="#131c2a" stroke="#253549" stroke-width="0.8"/>
    <text x="41" y="8" fill="#ffffff" font-family="sans-serif" font-size="5.2" font-weight="bold" text-anchor="middle">Nautiloid Drum Chassis</text>
    <text x="41" y="13" fill="#38bdf8" font-family="sans-serif" font-size="3.5" text-anchor="middle">Template: Wide</text>
    <image href="/components/kits_and_chassis/baby-nautiloid-combat-robot-radio-ready.png" x="4" y="15" width="74" height="23" preserveAspectRatio="xMidYMid meet"/>
    <g transform="translate(4, 39)">
      <rect x="0" y="0" width="74" height="10.5" rx="2" fill="#0c121c" stroke="#1e293b" stroke-width="0.5"/>
      <text x="12" y="4" fill="#94a3b8" font-family="sans-serif" font-size="2.6" text-anchor="middle">WEIGHT</text>
      <text x="12" y="8.8" fill="#f59e0b" font-family="sans-serif" font-size="4" font-weight="bold" text-anchor="middle">3</text>
      <line x1="25" y1="1.5" x2="25" y2="9" stroke="#1e293b" stroke-width="0.5"/>
      <text x="37" y="4" fill="#94a3b8" font-family="sans-serif" font-size="2.6" text-anchor="middle">COST</text>
      <text x="37" y="8.8" fill="#10b981" font-family="sans-serif" font-size="4" font-weight="bold" text-anchor="middle">$2</text>
      <line x1="49" y1="1.5" x2="49" y2="9" stroke="#1e293b" stroke-width="0.5"/>
      <text x="61" y="4" fill="#94a3b8" font-family="sans-serif" font-size="2.6" text-anchor="middle">FLIP STR</text>
      <text x="61" y="8.8" fill="#f43f5e" font-family="sans-serif" font-size="4" font-weight="bold" text-anchor="middle">4</text>
    </g>
  </g>

  <!-- Rules Note on Sheet -->
  <g class="sheet-rules-note" transform="translate(275.0, 7)">
    <text x="0" y="6" fill="#64748b" font-family="sans-serif" font-size="3.8">A3 Mat (420mm x 297mm) - Cards: 44mm x 64mm (Half-Poker)</text>
    <text x="0" y="12" fill="#64748b" font-family="sans-serif" font-size="3.8">All installed robot cards must sit on the chassis boundary</text>
  </g>

  <!-- Scale Bar (Bottom Right) -->
  <g class="scale-bar" transform="translate(355.0, 290.0)">
    <line x1="0" y1="0" x2="44" y2="0" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="0" y1="-2" x2="0" y2="2" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="44" y1="-2" x2="44" y2="2" stroke="#ffffff" stroke-width="0.8"/>
    <text x="22" y="5" fill="#94a3b8" font-family="sans-serif" font-size="3.5" text-anchor="middle">Card Width (44mm)</text>
  </g>
</svg>

  </div>
</body>
</html>
