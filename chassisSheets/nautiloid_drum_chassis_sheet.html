<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nautiloid Drum Chassis - A3 Chassis Mat</title>
  <style>
    @page {
      size: A3 landscape;
      margin: 0;
    }
    body {
      margin: 0;
      padding: 0;
      background: #0f141c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .sheet-wrapper {
      width: 420mm;
      height: 297mm;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    @media print {
      body {
        background: none;
      }
      .sheet-wrapper {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="sheet-wrapper">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420.0 297.0" width="420.0mm" height="297.0mm" class="a3-sheet-svg">
  <defs>
    <pattern id="grid-10" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#2a3342" stroke-width="0.3" opacity="0.6"/>
    </pattern>
    <pattern id="grid-50" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#grid-10)"/>
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#3b485d" stroke-width="0.7" opacity="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00d26a"/>
    </marker>
  </defs>

  <!-- Sheet Background -->
  <rect x="0" y="0" width="420.0" height="297.0" fill="#0f141c" stroke="#1f2937" stroke-width="1"/>

  <!-- Grid Layer -->
  <rect x="0" y="0" width="420.0" height="297.0" fill="url(#grid-50)"/>

  <!-- Centerlines -->
  <line x1="210.0" y1="35" x2="210.0" y2="272.0" stroke="#00e5ff" stroke-width="0.4" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="30" y1="148.5" x2="390.0" y2="148.5" stroke="#00e5ff" stroke-width="0.4" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Chassis Boundary Shape -->
  <polygon points="70.0,75.0 350.0,75.0 350.0,225.0 70.0,225.0" fill="rgba(0, 229, 255, 0.04)" stroke="#00e5ff" stroke-width="2.5" stroke-linejoin="round" class="chassis-boundary-shape"/>

  <!-- Forward / Facing Indicator -->
  <g class="facing-indicator" transform="translate(210.0, 38)">
    <line x1="0" y1="12" x2="0" y2="0" stroke="#00d26a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="-3" fill="#00d26a" font-family="sans-serif" font-size="6" font-weight="bold" text-anchor="middle" letter-spacing="1">FRONT / HEADING</text>
  </g>

  <!-- Sheet Header / Title Box -->
  <g class="sheet-title-banner" transform="translate(18, 12)">
    <rect x="0" y="0" width="160" height="26" rx="3" fill="#161f2e" stroke="#253549" stroke-width="0.8"/>
    <text x="8" y="11" fill="#ffffff" font-family="sans-serif" font-size="7.5" font-weight="bold">Nautiloid Drum Chassis</text>
    <text x="8" y="20" fill="#94a3b8" font-family="sans-serif" font-size="5">Template: <tspan fill="#38bdf8" font-weight="bold">Wide</tspan> | Weight: <tspan fill="#f59e0b" font-weight="bold">3</tspan> | Cost: <tspan fill="#10b981" font-weight="bold">$2</tspan> | Flip: <tspan fill="#ec4899" font-weight="bold">4</tspan></text>
  </g>

  <!-- Rules Note on Sheet -->
  <g class="sheet-rules-note" transform="translate(270.0, 14)">
    <text x="0" y="8" fill="#64748b" font-family="sans-serif" font-size="4.2">A3 Mat (420mm x 297mm) - Cards: 64mm x 89mm</text>
    <text x="0" y="15" fill="#64748b" font-family="sans-serif" font-size="4.2">All cards installed on robot must be touching chassis</text>
  </g>

  <!-- Scale Bar (Bottom Right) -->
  <g class="scale-bar" transform="translate(330.0, 282.0)">
    <line x1="0" y1="0" x2="64" y2="0" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#ffffff" stroke-width="1"/>
    <line x1="64" y1="-3" x2="64" y2="3" stroke="#ffffff" stroke-width="1"/>
    <text x="32" y="7" fill="#94a3b8" font-family="sans-serif" font-size="4" text-anchor="middle">Standard Card Width (64mm)</text>
  </g>
</svg>

  </div>
</body>
</html>
