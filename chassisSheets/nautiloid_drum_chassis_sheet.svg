<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420.0 297.0" width="420.0mm" height="297.0mm" class="a3-sheet-svg">
  <defs>
    <pattern id="grid-10" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#2a3342" stroke-width="0.3" opacity="0.6"/>
    </pattern>
    <pattern id="grid-50" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#grid-10)"/>
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#3b485d" stroke-width="0.7" opacity="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00d26a"/>
    </marker>
  </defs>

  <!-- Sheet Background -->
  <rect x="0" y="0" width="420.0" height="297.0" fill="#0f141c" stroke="#1f2937" stroke-width="1"/>

  <!-- Grid Layer -->
  <rect x="0" y="0" width="420.0" height="297.0" fill="url(#grid-50)"/>

  <!-- Centerlines -->
  <line x1="210.0" y1="35" x2="210.0" y2="272.0" stroke="#00e5ff" stroke-width="0.4" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="30" y1="148.5" x2="390.0" y2="148.5" stroke="#00e5ff" stroke-width="0.4" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Chassis Boundary Shape -->
  <polygon points="15.0,35.0 405.0,35.0 405.0,278.0 15.0,278.0" fill="rgba(0, 229, 255, 0.04)" stroke="#00e5ff" stroke-width="2.5" stroke-linejoin="round" class="chassis-boundary-shape"/>

  <!-- Forward / Facing Indicator -->
  <g class="facing-indicator" transform="translate(210.0, 20)">
    <line x1="0" y1="8" x2="0" y2="0" stroke="#00d26a" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="0" y="-2" fill="#00d26a" font-family="sans-serif" font-size="5" font-weight="bold" text-anchor="middle" letter-spacing="1">FRONT / HEADING</text>
  </g>

  <!-- Sheet Header / Title Box -->
  <g class="sheet-title-banner" transform="translate(18, 5)">
    <rect x="0" y="0" width="155" height="21" rx="3" fill="#161f2e" stroke="#253549" stroke-width="0.8"/>
    <text x="7" y="9" fill="#ffffff" font-family="sans-serif" font-size="6.5" font-weight="bold">Nautiloid Drum Chassis</text>
    <text x="7" y="16.5" fill="#94a3b8" font-family="sans-serif" font-size="4.2">Template: <tspan fill="#38bdf8" font-weight="bold">Wide</tspan> | Weight: <tspan fill="#f59e0b" font-weight="bold">3</tspan> | Cost: <tspan fill="#10b981" font-weight="bold">$2</tspan> | Flip: <tspan fill="#ec4899" font-weight="bold">4</tspan></text>
  </g>

  <!-- Rules Note on Sheet -->
  <g class="sheet-rules-note" transform="translate(280.0, 7)">
    <text x="0" y="6" fill="#64748b" font-family="sans-serif" font-size="3.8">A3 Mat (420mm x 297mm) - Poker Cards: 64mm x 89mm</text>
    <text x="0" y="12" fill="#64748b" font-family="sans-serif" font-size="3.8">All installed robot cards must sit on the chassis boundary</text>
  </g>

  <!-- Scale Bar (Bottom Right) -->
  <g class="scale-bar" transform="translate(335.0, 290.0)">
    <line x1="0" y1="0" x2="64" y2="0" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="0" y1="-2" x2="0" y2="2" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="64" y1="-2" x2="64" y2="2" stroke="#ffffff" stroke-width="0.8"/>
    <text x="32" y="5" fill="#94a3b8" font-family="sans-serif" font-size="3.5" text-anchor="middle">Poker Card Width (64mm)</text>
  </g>
</svg>
